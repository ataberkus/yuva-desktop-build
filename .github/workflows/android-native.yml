# Builds and tests the native Android app (native/android in ataberkus/yuva-prealpha, Kotlin and Jetpack Compose;
# docs/native-plan.md; private, checked out with the read-only deploy key YUVA_SOURCE_KEY): unit tests, a debug APK
# to try (Yuva-Android-native artifact, public), and a launch on an emulator with a screenshot.
name: Android native
run-name: Android native ${{ inputs.ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: yuva-prealpha branch, tag or commit to build
        required: true
        default: main
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/android-native.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: native/android
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ataberkus/yuva-prealpha
          ref: ${{ inputs.ref || github.ref_name }}
          ssh-key: ${{ secrets.YUVA_SOURCE_KEY }}
          persist-credentials: false
      - name: Source
        run: git log -1 --format='%h %s'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -q testDebugUnitTest assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Yuva-native-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Yuva-Android-native
          path: native/dist/Yuva-native-debug.apk
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Yuva-Android-native
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r apk/*.apk
            adb logcat -c
            adb shell monkey -p chat.yuva.app.preview -c android.intent.category.LAUNCHER 1
            sleep 20
            mkdir -p smoke && adb exec-out screencap -p > smoke/launch.png
            adb logcat -d -b crash > smoke/crash.txt || true
            adb shell pidof chat.yuva.app.preview || (echo "::error::Yuva exited during launch"; cat smoke/crash.txt; exit 1)
            if [ -s smoke/crash.txt ]; then echo "::error::crash during launch"; cat smoke/crash.txt; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yuva-Android-native-smoke
          path: smoke
          if-no-files-found: warn
