# Builds the iOS app (mobile/ in ataberkus/yuva-prealpha, a Capacitor shell that opens https://yuva.chat; private,
# checked out with the read-only deploy key YUVA_SOURCE_KEY) and, with `testflight`, uploads it to App Store Connect,
# where it shows up in TestFlight once Apple has processed it (5-30 min).
#
# Every run first builds for the simulator, launches the app there and keeps a screenshot (Actions → this run →
# Artifacts, public). The upload then signs a Release archive by hand, as Akış's TestFlight workflow does, with the
# same Apple Developer team, distribution certificate and App Store Connect API key (App Manager role is enough).
# mobile/scripts/testflight.mjs registers the App ID chat.yuva.app, keeps the App Store profile "Yuva App Store" and
# picks the build number (one above App Store Connect's highest for mobile/package.json's version).
#
# Before the first upload (once):
#   1. Repository secrets (Settings → Secrets → Actions), the values Akış's upload uses:
#        ASC_KEY_ID, ASC_ISSUER_ID   the App Store Connect API key's ID and its issuer
#        ASC_KEY_P8                  the key's AuthKey_<id>.p8 text
#        APPLE_TEAM_ID               the 10-character Team ID
#        IOS_DIST_CERT_P12           base64 of the Apple Distribution certificate + key (.p12)
#        IOS_DIST_CERT_PASSWORD      its password
#   2. appstoreconnect.apple.com → Apps → "+" → New App: iOS, name Yuva, bundle ID chat.yuva.app (Apple's API can't
#      create apps; the bundle ID is listed once a run has registered it, or register it under Identifiers).
#   The first log step says which secrets are set; the run stops with what is missing.
#
# Pushes to claude/** branches of this repo that change this file build the source branch of the same name, without
# uploading.
name: iOS
run-name: iOS ${{ inputs.ref || github.ref_name }}${{ inputs.testflight && ' (TestFlight)' || '' }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: yuva-prealpha branch, tag or commit to build
        required: true
        default: main
      testflight:
        description: Upload to App Store Connect / TestFlight
        type: boolean
        default: true
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/ios.yml"]

permissions:
  contents: read

concurrency:
  # One at a time: the build number is read from App Store Connect before the upload.
  group: ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.MAC_TEAM_ID }}
      UPLOAD: ${{ inputs.testflight && 'true' || 'false' }}
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - name: Upload credentials
        # Says which secrets are set (never their values), so the log shows what an upload still lacks.
        working-directory: .
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          missing=
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD; do
            if [ -n "${!s}" ]; then echo "$s: set"; else echo "$s: not set"; missing="$missing $s"; fi
          done
          if [ "$UPLOAD" = true ] && [ -n "$missing" ]; then
            echo "::error::TestFlight upload needs the repository secrets:$missing (see the top of ios.yml)"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ataberkus/yuva-prealpha
          ref: ${{ inputs.ref || github.ref_name }}
          ssh-key: ${{ secrets.YUVA_SOURCE_KEY }}
          persist-credentials: false
      - name: Source
        id: source
        run: |
          echo "Building $(git rev-parse HEAD)"
          version=$(node -p 'require("./package.json").version')
          echo "Yuva iOS $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          xcodebuild -version
      - name: Capacitor sync
        run: |
          npm ci
          npx cap sync ios
      - name: Simulator build
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/sim" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION=1 \
            build | tail -n 40
          test "${PIPESTATUS[0]}" = 0
      - name: Launch smoke
        # The app must stay up with the site loaded; the screenshot goes into the artifact to look at. The runner's
        # simulator can hang while booting (data migration): a failure here is reported but doesn't stop the upload.
        timeout-minutes: 8
        continue-on-error: true
        run: |
          udid=$(xcrun simctl list devices available -j |
            jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))] | last | .udid')
          [ -n "$udid" ] && [ "$udid" != null ] || { echo "::error::no iPhone simulator"; xcrun simctl list devices available; exit 1; }
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$RUNNER_TEMP/sim/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$udid" chat.yuva.app
          sleep 30
          mkdir -p dist
          xcrun simctl io "$udid" screenshot dist/launch.png || echo "::warning::no screenshot"
          xcrun simctl spawn "$udid" launchctl list | grep -q chat.yuva.app || { echo "::error::Yuva exited during launch"; exit 1; }
      - name: Signing
        if: env.UPLOAD == 'true'
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          p12="$RUNNER_TEMP/dist.p12"
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          trap 'rm -f "$p12"' EXIT
          printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode > "$p12"
          security import "$p12" -k "$keychain" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          serial=$(openssl pkcs12 -in "$p12" -nokeys -clcerts -passin env:IOS_DIST_CERT_PASSWORD | openssl x509 -noout -serial)
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
          # App ID, App Store Connect app, provisioning profile and build number (mobile/scripts/testflight.mjs).
          profile="$RUNNER_TEMP/yuva.mobileprovision"
          CERT_SERIAL="$serial" PROFILE_OUT="$profile" node scripts/testflight.mjs > "$RUNNER_TEMP/asc.env"
          cat "$RUNNER_TEMP/asc.env"
          cat "$RUNNER_TEMP/asc.env" >> "$GITHUB_ENV"
          uuid=$(sed -n 's/^PROFILE_UUID=//p' "$RUNNER_TEMP/asc.env")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done
      - name: Archive
        if: env.UPLOAD == 'true'
        working-directory: mobile/ios/App
        # Manual signing for the app target only (the project is Capacitor's, with automatic signing): build settings
        # on the command line would reach the Swift packages too, which take no profile.
        run: |
          set -o pipefail
          perl -0pi -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g;
            s/(PRODUCT_BUNDLE_IDENTIFIER = chat\.yuva\.app;)/$1\n\t\t\t\tDEVELOPMENT_TEAM = $ENV{APPLE_TEAM_ID};\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{PROFILE_NAME}";\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";/g' \
            App.xcodeproj/project.pbxproj
          xcodebuild archive -quiet -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Yuva.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"
          echo "Archived Yuva $VERSION ($BUILD_NUMBER)"
      - name: Upload to TestFlight
        if: env.UPLOAD == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>chat.yuva.app</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Yuva.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Yuva iOS $VERSION ($BUILD_NUMBER) uploaded: it appears in App Store Connect → TestFlight once processed." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yuva-iOS
          path: mobile/dist/launch.png
          if-no-files-found: warn
      - name: Remove signing material
        if: always()
        working-directory: .
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/dist.p12
          [ -z "$KEYCHAIN" ] || security delete-keychain "$KEYCHAIN" || true
